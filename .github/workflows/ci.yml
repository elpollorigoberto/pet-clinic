name: CI

on:
  workflow_call:
  push:
  pull_request: 

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  Build:
    runs-on: ubuntu-latest
    name: Build
    steps:   
    
      - name: Git Clone
        uses: actions/checkout@v4
      
      - name: Set Up JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Mvn compile
        run: |
          mvn -q -DskipTests package
      
      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/
                    
  Docker-build:
    name: Build Docker Image
    needs: 
      - Build
    runs-on: ubuntu-latest
    steps:
    
      - name: Git Clone
        uses: actions/checkout@v4

      - name: Download Maven artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: target/

      - name: Prepare JAR for Dockerfile
        run: |
          cp target/*.jar spring-petclinic-2.6.0.jar
          
      - name: Docker Login
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.USER_DOCKER}}
          password: ${{ secrets.PASS_DOCKER}}

      - name: Docker Build
        run: | 
          docker build --tag elpollorigoberto/pet-clinic:latest .

