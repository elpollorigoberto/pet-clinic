name: CI

on:
  workflow_call:
  push:
  pull_request: 
  workflow_dispatch: 

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:

  SAST:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Git Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK for SonarCloud
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -q -DskipTests verify sonar:sonar \
            -Dsonar.projectKey=elpollorigoberto_pet-clinic \
            -Dsonar.organization=elpollorigobertoorgkey \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Query SonarCloud vulnerabilities
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: elpollorigoberto_pet-clinic
        run: |
          sleep 20

          curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&types=VULNERABILITY&severities=MAJOR,CRITICAL,BLOCKER&statuses=OPEN,CONFIRMED,REOPENED" \
            -o sonar-vulnerabilities.json

          cat sonar-vulnerabilities.json
          jq '.total' sonar-vulnerabilities.json

      - name: Show SonarCloud vulnerability summary
        if: always()
        run: |
          echo "## SonarCloud SAST Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          total=$(jq '.total // 0' sonar-vulnerabilities.json)
          echo "**Total vulnerabilities MAJOR/CRITICAL/BLOCKER:** $total" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Severity | Rule | File | Line | Message |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---:|---|" >> $GITHUB_STEP_SUMMARY

          jq -r '
            (.issues // [])[]
            | "| \(.severity) | \(.rule) | \(.component) | \(.line // "N/A") | \(.message | gsub("\\|"; "\\|")) |"
          ' sonar-vulnerabilities.json >> $GITHUB_STEP_SUMMARY
      
      - name: Upload SonarCloud SAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-sast-vulnerabilities
          path: sonar-vulnerabilities.json

      - name: Fail on MEDIUM/HIGH/CRITICAL Sonar vulnerabilities
        run: |
          total=$(jq '.total // 0' sonar-vulnerabilities.json)

          echo "SonarCloud vulnerabilities MAJOR/CRITICAL/BLOCKER: $total"

          if [ "$total" -gt 0 ]; then
            echo "SAST failed: SonarCloud found vulnerabilities with severity MEDIUM or higher."
            exit 1
          fi
            
  Build:
    needs:
      - SAST
    runs-on: ubuntu-latest
    name: Build
    steps:   
    
      - name: Git Clone
        uses: actions/checkout@v4
      
      - name: Set Up JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Mvn compile
        run: |
          mvn -q -DskipTests package
      
      - name: Upload Maven artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/*.jar

  SCA:
    needs:
        - SAST
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Git Clone
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Build
        run: |
          mvn -q -DskipTests package
          
      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'pet-clinic'
          path: '.'
          format: 'ALL'
          args: >
            --failOnCVSS 4
          
      - name: Upload Dependency Check SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ github.workspace }}/reports/dependency-check-report.sarif

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports
                    
  Docker-build:
    name: Build Docker Image
    needs: 
      - Build
      - SCA
    runs-on: ubuntu-latest
    steps:
    
      - name: Git Clone
        uses: actions/checkout@v4

      - name: Download Maven artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: target/

      - name: Prepare JAR for Dockerfile
        run: |
          cp target/*.jar spring-petclinic-2.6.0.jar
          
      - name: Docker Login
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.USER_DOCKER}}
          password: ${{ secrets.PASS_DOCKER}}

      - name: Docker Build
        run: | 
          docker build --tag elpollorigoberto/pet-clinic:latest .

      - name: Image Security
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'elpollorigoberto/pet-clinic:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-security-report
          path: trivy-results.sarif

      - name: Docker Push
        run: | 
          docker push elpollorigoberto/pet-clinic:latest
